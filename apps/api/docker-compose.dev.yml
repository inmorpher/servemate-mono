services:
  servemate-service:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    container_name: servemate-service-dev
    ports:
      - "3000:3000"
    volumes:
      - ../..:/app                  # Синхронизируем монорепо
      - /app/node_modules           # node_modules из образа (linux), не с хоста
      - /app/apps/api/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - servemate-network

  mcp:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    container_name: servemate-mcp-dev
    command: ["npm", "run", "mcp"]
    stdin_open: true
    tty: true
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - servemate-network

networks:
  servemate-network:
    driver: bridge
